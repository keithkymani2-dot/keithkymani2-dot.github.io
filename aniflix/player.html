<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aniflix - Stream Anime</title>
    <!-- Link to external styling sheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>



    <!-- LIQUID GLASS BOTTOM UTILITY BAR -->
    <navbar class="liquid-glass">
        </div>
         
            <li
            
            
        </ul>
    </navbar>

    <!-- CONTENT PORTAL WRAPPER -->
    <div id="home-page">
        <!-- FEATURED BANNER ROW -->
        <section class="billboard">
            <div class="billboard-content">
                <h1 class="billboard-title">Cyber Strike</h1>
                <div class="billboard-meta">
                    <span class="match">99% Match</span>
                    <span>2026</span>
                    <span class="rating">18+</span>
                    <span>Action / Sci-Fi</span>
                </div>
                <p class="billboard-desc">Uncover corporate networks, neon street fights, and tactical showdowns in a complete cybernetic underworld saga across New Tokyo.</p>
                <div class="btn-stack">
                    <button class="btn btn-play" id="hero-play-btn">▶ Play</button>
                </div>
            </div>
        </section>

        <!-- STREAM CAROUSEL ROWS -->
        <div class="row-container">
            <h2 class="row-title">Trending Anime Selections</h2>
            <div class="card-slider" id="row-trending"></div>
        </div>

        <div class="row-container">
            <h2 class="row-title">High Energy Shonen Deals</h2>
            <div class="card-slider" id="row-shonen"></div>
        </div>
    </div>

    <!-- GLOSSMORPHIC MODAL STREAMS -->
    <div id="video-player-overlay">
        <div class="player-window liquid-glass">
            <button class="close-player" id="close-player-btn">×</button>
            <div id="video-injector"></div>
        </div>
    </div>

    <!-- Link to external javascript engine -->
    <script src="script.js"></script>
</body>
</html>
